<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#14161a; --panel:#1c2026; --panel-2:#232830; --rail:#2b313a; --well:#0f1114;
  --ink:#e8eaed; --ink-2:#b6bcc6; --muted:#818995;
  --accent:#ff4d2e; --accent-dim:#5c2116;
  --atk:#c9503c; --def:#4a90d9; --sta:#46a06a; --bal:#c08a3e; --spc:#8f7ad0;
  --ok:#46a06a; --warn:#c08a3e;
  --disp:"Chakra Petch","PingFang HK","Microsoft JhengHei",sans-serif;
  --body:system-ui,-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
  --mono:"Roboto Mono",ui-monospace,monospace;
  --pad:clamp(10px,3vw,20px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--rail);padding-top:env(safe-area-inset-top,0px)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px var(--pad) 8px}
.mark{width:30px;height:30px;flex:none;display:grid;place-items:center;
  background:var(--accent);color:#14161a;font-family:var(--disp);font-weight:700;
  font-size:19px;line-height:1;clip-path:polygon(0 0,100% 0,100% 76%,76% 100%,0 100%)}
h1{margin:0;font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.04em}
h1 span{display:block;font-family:var(--body);font-size:10.5px;font-weight:400;
  color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.hbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;
  border:1px solid var(--rail);border-radius:999px;color:var(--muted);
  font-family:var(--mono);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.pill.live .dot{background:var(--ok)}
.pill.local .dot{background:var(--warn)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rail);
  border-radius:6px;color:var(--ink-2);font-size:14px;background:var(--panel)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

.tools{display:flex;flex-direction:column;gap:8px;padding:0 var(--pad) 10px}
.seg{display:flex;background:var(--panel);border:1px solid var(--rail);border-radius:7px;
  padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:5px;font-size:12.5px;color:var(--muted);
  font-weight:500;white-space:nowrap}
.seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rail)}
.seg button b{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
  color:var(--muted);margin-top:1px}
.seg button.on b{color:var(--accent)}
.filters{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chipf{flex:none;padding:5px 11px;border:1px solid var(--rail);border-radius:999px;
  font-size:12px;color:var(--ink-2);background:var(--panel)}
.chipf.on{border-color:currentColor;background:var(--panel-2)}
.chipf[data-t=atk].on{color:var(--atk)}
.chipf[data-t=def].on{color:var(--def)}
.chipf[data-t=sta].on{color:var(--sta)}
.chipf[data-t=bal].on{color:var(--bal)}
.chipf[data-t=all].on,.chipf[data-t=own].on,.chipf[data-t=wbo].on{color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--rail);border-radius:7px;padding:0 10px}
.search input{flex:1;background:none;border:none;padding:9px 0;font-size:14px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none}
.search button{color:var(--muted);font-size:15px;padding:4px}

main{display:flex;flex-direction:column;gap:9px;padding:0 0 40px;
  padding-left:max(var(--pad),env(safe-area-inset-left,0px));
  padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.tier{display:flex;background:var(--panel);border:1px solid var(--rail);
  border-radius:8px;overflow:hidden;min-height:60px}
.railcol{flex:none;width:48px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px 0;position:relative;
  background:var(--panel-2);border-right:1px solid var(--rail)}
.railcol::after{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;
  background:repeating-linear-gradient(180deg,var(--tc) 0 5px,transparent 5px 9px)}
.railcol .t{font-family:var(--disp);font-size:21px;font-weight:700;line-height:1;color:var(--tc)}
.railcol .t.sm{font-size:11px;font-family:var(--body);writing-mode:vertical-rl;
  letter-spacing:.2em;color:var(--muted)}
.railcol .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.bay{flex:1;display:grid;gap:6px;padding:8px;min-width:0;align-content:flex-start;
  grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.bay .empty{color:var(--muted);font-size:12px;padding:6px 2px;grid-column:1/-1}

.part{background:var(--ground);border:1px solid var(--rail);border-top:2px solid var(--pc);
  border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:3px;
  min-width:0;text-align:left;transition:border-color .12s,transform .12s}
.part:hover{border-color:var(--pc);transform:translateY(-1px)}
.part[data-t=atk]{--pc:#c9503c}
.part[data-t=def]{--pc:#4a90d9}
.part[data-t=sta]{--pc:#46a06a}
.part[data-t=bal]{--pc:#c08a3e}
.part[data-t=spc]{--pc:#8f7ad0}
.part[data-t=x]{--pc:#5a6270}
.thumb{aspect-ratio:1;background:var(--well);border-radius:3px;overflow:hidden;
  position:relative;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph{font-size:9px;color:var(--muted);text-align:center;padding:4px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.flags{position:absolute;top:3px;right:3px;display:flex;gap:3px;align-items:center}
.own{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 1.5px var(--well)}
.wbo{font-family:var(--mono);font-size:8px;line-height:1.4;padding:0 3px;border-radius:2px;
  background:var(--accent);color:#14161a;font-weight:500}
.wbo.cfg{background:var(--rail);color:var(--ink-2);font-family:var(--body);font-size:8.5px}

/* 推薦配置 */
.combos{display:flex;flex-direction:column;gap:6px}
.combo{background:var(--ground);border:1px solid var(--rail);border-radius:6px;
  padding:9px 11px;display:flex;align-items:center;gap:10px}
.combo .cmb{font-family:var(--mono);font-size:14px;letter-spacing:.02em;flex:1;min-width:0}
.combo .cmb small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted);
  letter-spacing:0;margin-top:3px;line-height:1.4;white-space:pre-line}
.combo .rate{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--accent);
  line-height:1;text-align:right;flex:none}
.combo .rate span{display:block;font-family:var(--body);font-size:9px;font-weight:400;
  color:var(--muted);letter-spacing:.08em;margin-top:3px}
.combo .rate.none{font-size:11px;font-family:var(--body);font-weight:400;color:var(--muted)}
.nodata{background:var(--ground);border-left:2px solid var(--rail);padding:9px 11px;
  border-radius:0 5px 5px 0;color:var(--muted);font-size:12.5px}
.part .nm{font-size:11px;line-height:1.25;font-weight:500;min-height:27px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.part .cd{font-family:var(--mono);font-size:9px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(10,11,13,.72);
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);
  border-top:1px solid var(--rail);border-radius:14px 14px 0 0;
  padding:6px var(--pad) max(18px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;border-radius:2px;background:var(--rail);margin:6px auto 12px}
.sheet h2{font-family:var(--disp);font-size:17px;margin:0 0 2px;font-weight:600;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px}
.sheethead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.sheethead .thumb{width:84px;flex:none;border:1px solid var(--rail)}
.sheethead .meta{min-width:0;flex:1}
.sheethead h2{margin-bottom:4px}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.typepick{display:flex;gap:5px}
.typepick button{flex:1;padding:9px 0;border:1px solid var(--rail);border-radius:5px;
  font-size:13px;color:var(--ink-2);background:var(--ground)}
.typepick button.on{border-color:var(--ink-2);color:var(--ink);background:var(--panel-2)}
textarea,.txt{width:100%;background:var(--ground);border:1px solid var(--rail);
  border-radius:6px;padding:9px;font-size:14px}
textarea{resize:vertical;min-height:62px}
textarea:focus,.txt:focus{outline:none;border-color:var(--accent)}
.rowbtns{display:flex;gap:8px}
.btn{flex:1;padding:11px;border:1px solid var(--rail);border-radius:6px;text-align:center;
  font-size:14px;background:var(--ground);color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14161a;font-weight:600}
.btn.on{border-color:var(--ok);color:var(--ok);background:var(--panel-2)}
.btn.danger{color:var(--atk);border-color:var(--accent-dim)}
.src{font-size:13px;color:var(--ink-2);line-height:1.65}
.src h3{font-family:var(--disp);font-size:13px;margin:16px 0 4px;color:var(--ink);letter-spacing:.03em}
.src ul{margin:0;padding-left:17px}
.src li{margin-bottom:3px}
.src a{color:var(--accent)}
.src .caveat{background:var(--ground);border-left:2px solid var(--warn);padding:9px 11px;
  border-radius:0 5px 5px 0;color:var(--ink-2);font-size:12.5px;margin-top:10px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
  color:var(--muted);padding:0 var(--pad) 10px}
.stats b{color:var(--ink-2);font-weight:500}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:50;
  background:var(--panel-2);border:1px solid var(--rail);border-radius:999px;
  padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

  <div class="hbar">

</header>

<div class="stats" id="stats"></div>
<main id="board"></main>

function combosFor(it){
  if(it.cat === "bl"){
    var keys = Object.keys(COMBOS);
    for(var i = 0; i < keys.length; i++){
      if(it.zh.indexOf(keys[i]) === 0) return COMBOS[keys[i]].map(function(x){
        return {c:x.c, wr:x.wr, s:x.s, blade:null};
      });
    }
    return [];
  }
  var out = [];
  Object.keys(COMBOS).forEach(function(blade){
    COMBOS[blade].forEach(function(x){
      var toks = x.c.split(/[\s·]+/).filter(Boolean);
      if(toks.indexOf(it.zh) >= 0) out.push({c:x.c, wr:x.wr, s:x.s, blade:blade});
    });
  });
  return out;
}
function bestWr(list){
  var m = null;
  list.forEach(function(x){ if(typeof x.wr === "number" && (m === null || x.wr > m)) m = x.wr; });
  return m;
}

var TIERS = [
  ["X","#ff4d2e"],["S+","#ff7043"],["S","#ff9057"],["A+","#e8a04f"],["A","#cfa855"],
  ["B+","#a89a5c"],["B","#868a64"],["C+","#6d7a72"],["C","#5f6d7d"],["D+","#586380"],
  ["D","#525a72"],["E+","#4c5165"],["E","#464a5a"],["-","#3b424d"]
];
var TIER_COLOR = {};
TIERS.forEach(function(t){ TIER_COLOR[t[0]] = t[1]; });

var CATS = [
  {k:"bl", zh:"上蓋", en:"BLADE"},
  {k:"ra", zh:"固鎖", en:"RATCHET"},
  {k:"bi", zh:"軸心", en:"BIT"},
  {k:"as", zh:"輔助", en:"ASSIST"}
];
var TYPE_ZH = {atk:"攻擊", def:"防禦", sta:"耐久", bal:"均衡", spc:"特殊", x:""};

/* 解析種子資料 */
var SEED = [];
RAW.trim().split("\n").forEach(function(line){
  var p = line.split("|");
  if(p.length < 6) return;
  var code = p[2], name = p[3];
  SEED.push({
    id: p[1] + "/" + (code || name) + "/" + name,
    cat: p[1], tier: p[0], code: code || null, zh: name,
    type: p[4] || "x", img: p[5] || null,
    en: EN[code] || EN[name] || null,
    wbo: WBO[code] || (code ? null : WBO[name]) || null
  });
});
SEED.forEach(function(i){
  i.combos = combosFor(i);
  i.wr = bestWr(i.combos);
});
var BY_ID = {};
SEED.forEach(function(i){ BY_ID[i.id] = i; });

/* ============================================================
   狀態：種子放喺程式碼，改動只存 overrides
   ============================================================ */
var LS = "beyx-tier-v2";
var state = {tiers:{}, owned:{}, notes:{}, custom:[], hidden:[], updatedAt:0};
var db = null, docRef = null, saveTimer = null, booted = false;
var ui = {cat:"bl", type:"all", ownOnly:false, wboOnly:false, q:""};

function loadLocal(){
  try{
    var raw = localStorage.getItem(LS);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
}
function touch(){
  state.updatedAt = Date.now();
  saveLocal();
  render();
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    docRef.set(JSON.parse(JSON.stringify(state))).catch(function(e){
      setSync("local", "本機儲存");
      toast("同步唔到：" + (e && e.code ? e.code : "未知"));
    });
  }, 500);
}
function setSync(cls, tx){
  var el = document.getElementById("sync");
  el.className = "pill " + cls;
  document.getElementById("synctx").textContent = tx;
}

function customItems(){
  return state.custom.map(function(c){
    return {id:c.id, cat:c.cat, zh:c.zh, en:c.en||null, code:c.code||null,
            type:c.type||"x", tier:"-", img:null, wbo:null, isCustom:true};
  });
}
function itemById(id){
  if(BY_ID[id]) return BY_ID[id];
  var f = customItems().filter(function(i){ return i.id === id; });
  return f[0] || null;
}
function tierOf(it){
  return Object.prototype.hasOwnProperty.call(state.tiers, it.id)
    ? state.tiers[it.id] : it.tier;
}

/* ============================================================
   畫面
   ============================================================ */
function el(tag, cls, tx){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(tx != null) e.textContent = tx;
  return e;
}

function buildSeg(){
  var seg = document.getElementById("seg");
  seg.innerHTML = "";
  CATS.forEach(function(c){
    var b = el("button", ui.cat === c.k ? "on" : "");
    b.appendChild(document.createTextNode(c.zh));
    b.appendChild(el("b", null, c.en));
    b.onclick = function(){ ui.cat = c.k; buildSeg(); buildFilters(); render(); window.scrollTo(0,0); };
    seg.appendChild(b);
  });
}

function buildFilters(){
  var box = document.getElementById("filters");
  box.innerHTML = "";
  var defs = [["all","全部"],["atk","攻擊"],["def","防禦"],["sta","耐久"],["bal","均衡"]];
  var isBlade = ui.cat === "bl";
  defs.forEach(function(d){
    if(!isBlade && d[0] !== "all") return;
    var b = el("button", "chipf" + (ui.type === d[0] ? " on" : ""), d[1]);
    b.dataset.t = d[0];
    b.onclick = function(){ ui.type = d[0]; buildFilters(); render(); };
    box.appendChild(b);
  });
  var o = el("button", "chipf" + (ui.ownOnly ? " on" : ""), "只看已擁有");
  o.dataset.t = "own";
  o.onclick = function(){ ui.ownOnly = !ui.ownOnly; buildFilters(); render(); };
  box.appendChild(o);
  var w = el("button", "chipf" + (ui.wboOnly ? " on" : ""), "有配置數據");
  w.dataset.t = "wbo";
  w.onclick = function(){ ui.wboOnly = !ui.wboOnly; buildFilters(); render(); };
  box.appendChild(w);
  var a = el("button", "chipf", "＋ 加零件");
  a.dataset.t = "add";
  a.onclick = openAdd;
  box.appendChild(a);
}

function visibleItems(){
  var cat = ui.cat;
  var pool = SEED.filter(function(i){ return i.cat === cat; })
    .concat(customItems().filter(function(i){ return i.cat === cat; }))
    .filter(function(i){ return state.hidden.indexOf(i.id) < 0; });
  var q = ui.q.trim().toLowerCase();
  return pool.filter(function(i){
    if(ui.type !== "all" && i.type !== ui.type) return false;
    if(ui.ownOnly && !state.owned[i.id]) return false;
    if(ui.wboOnly && !(i.combos && i.combos.length)) return false;
    if(q){
      var hay = [i.zh, i.en, i.code,
        (i.combos || []).map(function(x){ return x.c; }).join(" ")].join(" ").toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function thumb(it, big){
  var t = el("div", "thumb");
  if(it.img){
    var im = document.createElement("img");
    im.src = IMG_BASE + it.img;
    im.alt = it.zh;
    im.loading = "lazy";
    im.decoding = "async";
    var ph = el("div", "ph", it.zh);
    ph.style.display = "none";
    im.onerror = function(){ im.style.display = "none"; ph.style.display = "block"; };
    t.appendChild(im);
    t.appendChild(ph);
  } else {
    t.appendChild(el("div", "ph", it.zh));
  }
  if(!big){
    var flags = el("div", "flags");
    if(typeof it.wr === "number") flags.appendChild(el("span", "wbo", it.wr + "%"));
    else if(it.combos && it.combos.length) flags.appendChild(el("span", "wbo cfg", "配置"));
    if(state.owned[it.id]) flags.appendChild(el("span", "own"));
    if(flags.children.length) t.appendChild(flags);
  }
  return t;
}

function partCard(it){
  var b = el("button", "part");
  b.dataset.t = it.type || "x";
  b.appendChild(thumb(it, false));
  b.appendChild(el("div", "nm", it.zh));
  b.appendChild(el("div", "cd", it.code || TYPE_ZH[it.type] || "—"));
  b.onclick = function(){ openEditor(it.id); };
  return b;
}

function render(){
  var board = document.getElementById("board");
  board.innerHTML = "";
  var items = visibleItems();
  var byTier = {};
  TIERS.forEach(function(t){ byTier[t[0]] = []; });
  items.forEach(function(i){
    var t = tierOf(i);
    (byTier[t] || byTier["-"]).push(i);
  });

  var shown = 0;
  TIERS.forEach(function(t){
    var list = byTier[t[0]];
    if(!list.length && (ui.q || ui.ownOnly || ui.wboOnly || ui.type !== "all")) return;
    shown++;
    var row = el("div", "tier");
    row.style.setProperty("--tc", t[1]);
    var rail = el("div", "railcol");
    var lab = el("div", "t" + (t[0] === "-" ? " sm" : ""), t[0] === "-" ? "未分級" : t[0]);
    rail.appendChild(lab);
    rail.appendChild(el("div", "n", String(list.length)));
    row.appendChild(rail);
    var bay = el("div", "bay");
    if(!list.length) bay.appendChild(el("div", "empty", "—"));
    else list.forEach(function(i){ bay.appendChild(partCard(i)); });
    row.appendChild(bay);
    board.appendChild(row);
  });
  if(!shown) board.appendChild(el("div", "empty", "搵唔到符合嘅零件"));

  var owned = items.filter(function(i){ return state.owned[i.id]; }).length;
  var withCombo = items.filter(function(i){ return i.combos && i.combos.length; }).length;
  var st = document.getElementById("stats");
  st.innerHTML = "";
  [["顯示 ", String(items.length)], ["已擁有 ", String(owned)], ["有配置 ", String(withCombo)]]
    .forEach(function(p){
      var s = el("span", null, p[0]);
      s.appendChild(el("b", null, p[1]));
      st.appendChild(s);
    });
}

var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function openSheet(build){
  sheet.innerHTML = "";

}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
scrim.onclick = closeSheet;

function openEditor(id){
  var it = itemById(id);
  if(!it) return;
  openSheet(function(s){
    var head = el("div", "sheethead");
    head.appendChild(thumb(it, true));
    var meta = el("div", "meta");
    meta.appendChild(el("h2", null, it.zh));
    var bits = [it.en, it.code, TYPE_ZH[it.type]].filter(Boolean).join("  ·  ");
    meta.appendChild(el("div", "sub", bits || "自訂零件"));
    if(it.wbo){
      var w = el("div", "sub");
      w.textContent = "大賽數據站評 " + it.wbo + " 級（同呢個天梯用唔同方法，唔一定夾）";
      w.style.color = "var(--accent)";
      meta.appendChild(w);
    }
    head.appendChild(meta);
    s.appendChild(head);

    var f1 = el("div", "fld");
    var isBlade = it.cat === "bl";
    f1.appendChild(el("label", null, isBlade ? "推薦配置" : "用喺呢啲配置"));
    var list = it.combos || [];
    if(!list.length){
      f1.appendChild(el("div", "nodata",
        isBlade ? "呢隻上蓋冇公開嘅大賽配置數據。"
                : "呢件零件冇出現喺有記錄嘅頂級配置入面。"));
    } else {
      var box = el("div", "combos");
      list.forEach(function(x){
        var row = el("div", "combo");
        var cm = el("div", "cmb", (x.blade ? x.blade + "　" : "") + x.c);
        cm.appendChild(el("small", null,
          x.s.map(function(k){ return COMBO_SRC[k]; }).join("\n")));
        row.appendChild(cm);
        var r = el("div", "rate" + (typeof x.wr === "number" ? "" : " none"));
        if(typeof x.wr === "number"){
          r.textContent = x.wr + "%";
          r.appendChild(el("span", null, "勝率"));
        } else {
          r.textContent = "冇勝率數據";
        }
        row.appendChild(r);
        box.appendChild(row);
      });
      f1.appendChild(box);
    }
    s.appendChild(f1);

    if(it.wbo){
      var f2 = el("div", "fld");
      f2.appendChild(el("label", null, "另一套評級"));
      f2.appendChild(el("div", "nodata",
        "大賽入賞統計評 " + it.wbo + " 級。呢個天梯表係 " + tierOf(it) +
        " 級 —— 兩套方法唔同，唔一定夾。"));
      s.appendChild(f2);
    }

    var rb = el("div", "rowbtns");
    var ob = el("button", "btn" + (state.owned[it.id] ? " on" : ""),
                state.owned[it.id] ? "✓ 已擁有" : "標記已擁有");
    ob.onclick = function(){
      if(state.owned[it.id]) delete state.owned[it.id]; else state.owned[it.id] = 1;
      touch(); openEditor(id);
    };
    rb.appendChild(ob);
    var hb = el("button", "btn danger", "隱藏");
    hb.onclick = function(){
      state.hidden.push(it.id); touch(); closeSheet(); toast("已隱藏 " + it.zh);
    };
    rb.appendChild(hb);
    s.appendChild(rb);
  });
}

function openAdd(){
  openSheet(function(s){
    s.appendChild(el("h2", null, "加零件"));
    var cat = CATS.filter(function(c){ return c.k === ui.cat; })[0];
    s.appendChild(el("div", "sub", "加入「" + cat.zh + "」" + cat.en + "，會放喺未分級"));
    var mkf = function(lab, ph){
      var f = el("div", "fld");
      f.appendChild(el("label", null, lab));
      var i = document.createElement("input");
      i.className = "txt"; i.placeholder = ph;
      f.appendChild(i); s.appendChild(f);
      return i;
    };
    var zh = mkf("名稱（必填）", ui.cat === "ra" ? "例：3-75" : "例：新上蓋");
    var en = mkf("英文名", "選填");
    var cd = mkf("型號", ui.cat === "bl" ? "例：UX-22" : "選填");
    var typ = "x";
    if(ui.cat === "bl"){
      var f = el("div", "fld");
      f.appendChild(el("label", null, "屬性"));
      var row = el("div", "typepick");
      ["atk","def","sta","bal"].forEach(function(t){
        var b = el("button", "", TYPE_ZH[t]);
        b.onclick = function(){
          typ = t;
          Array.prototype.forEach.call(row.children, function(c){ c.className = ""; });
          b.className = "on";

        row.appendChild(b);
      });
      f.appendChild(row); s.appendChild(f);

    var rb = el("div", "rowbtns");
    var cancel = el("button", "btn", "取消"); cancel.onclick = closeSheet;
    var ok = el("button", "btn primary", "加入");
    ok.onclick = function(){

        en:en.value.trim(), code:cd.value.trim(), type:typ});
      touch(); closeSheet(); toast("加咗 " + nm);
    };
    rb.appendChild(cancel); rb.appendChild(ok);
    s.appendChild(rb);
  });
}

function openMenu(){
  openSheet(function(s){
    s.appendChild(el("h2", null, "更多"));
    s.appendChild(el("div", "sub", "備份同重設"));
    var mkb = function(t, cls, fn){
      var b = el("button", "btn " + (cls || ""), t);
      b.style.marginBottom = "8px"; b.style.width = "100%";
      b.onclick = fn; s.appendChild(b); return b;
    };
    mkb("匯出我的天梯（JSON）", "primary", doExport);
    var lab = document.createElement("label");
    lab.className = "btn"; lab.style.display = "block";
    lab.style.marginBottom = "8px"; lab.textContent = "匯入 JSON";
    var fi = document.createElement("input");
    fi.type = "file"; fi.accept = "application/json,.json"; fi.hidden = true;
    fi.onchange = doImport;
    lab.appendChild(fi);
    s.appendChild(lab);
    if(state.hidden.length){
      mkb("回復 " + state.hidden.length + " 個隱藏零件", "", function(){
        state.hidden = []; touch(); closeSheet(); toast("已回復");
      });
    }
    mkb("清除我的所有改動", "danger", function(){
      if(!confirm("會清走全部擁有標記、自訂零件同隱藏紀錄。確定？")) return;
      state = {owned:{}, custom:[], hidden:[], updatedAt:Date.now()};
      touch(); closeSheet(); toast("已重設");
    });
    mkb("關閉", "", closeSheet);
  });
}

function doExport(){
  var payload = JSON.stringify({app:"beyx-tier", v:2, exportedAt:new Date().toISOString(),
    state:state}, null, 2);
  var name = "beyx-tier-" + new Date().toISOString().slice(0,10) + ".json";
  if(window.__dl){
    window.__dl.save({filename:name, data:payload})
      .then(function(){ toast("已匯出"); })
      .catch(function(){ toast("匯出取消咗"); });
  } else {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], {type:"application/json"}));
    a.download = name; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast("已匯出");
  }
}
function doImport(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var j = JSON.parse(r.result);
      var st = j.state || j;
      if(!st || typeof st !== "object") throw 0;
      state = Object.assign({tiers:{}, owned:{}, notes:{}, custom:[], hidden:[]}, st);
      touch(); closeSheet(); toast("匯入完成");
    }catch(err){ toast("檔案讀唔到，要係本 app 匯出嘅 JSON"); }
  };
  r.readAsText(f);
}

var toastT = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

  qc.hidden = !qi.value;
  clearTimeout(qt);
  qt = setTimeout(function(){ ui.q = qi.value; render(); }, 150);
};
qc.onclick = function(){ qi.value = ""; ui.q = ""; qc.hidden = true; render(); };
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSheet();
});

loadLocal();
buildSeg(); buildFilters(); render();
setSync("local", "本機儲存");

if(window.claude && window.claude.use){
  window.claude.use("downloads").then(function(d){ if(d) window.__dl = d; }).catch(function(){});
  window.claude.use("db").then(function(store){
    if(!store) return;
    db = store;
    docRef = db.doc("state/tierlist");
    docRef.onSnapshot(function(snap){
      if(snap.exists){
        var remote = snap.data();
        if(!booted || (remote.updatedAt || 0) > (state.updatedAt || 0)){
          state = Object.assign({tiers:{}, owned:{}, notes:{}, custom:[], hidden:[]}, remote);
          saveLocal(); render();
        }
      } else if(!booted && state.updatedAt){
        docRef.set(JSON.parse(JSON.stringify(state))).catch(function(){});
      }
      booted = true;
      setSync("live", "已同步");
    }, function(){
      setSync("local", "本機儲存");
    });
  }).catch(function(){});
}

/* Service worker：只喺獨立網站版行（Artifact 冇 manifest，唔會註冊） */
if(document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound", function(){
        var w = reg.installing;
        if(!w) return;
        w.addEventListener("statechange", function(){
          if(w.state === "installed" && navigator.serviceWorker.controller){
            toast("有新版本，熄咗再開就更新");
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
